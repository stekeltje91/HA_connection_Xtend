title: Xtend Heatpump & Boiler
path: xtend-heatpump-boiler
icon: mdi:heating-coil
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Heat pump
        icon: mdi:heat-pump-outline
      # Alerts: only visible when the Xtend reports something
      - type: tile
        entity: sensor.xtend_notification_code
        name: Notification
        color: amber
        grid_options:
          columns: 12
        visibility:
          - condition: state
            entity: sensor.xtend_notification_code
            state_not: ["-", unavailable, unknown]
      - type: tile
        entity: sensor.xtend_errorcode
        name: Error
        color: red
        grid_options:
          columns: 12
        visibility:
          - condition: state
            entity: sensor.xtend_errorcode
            state_not: ["-", no_error, unavailable, unknown]
      - type: tile
        entity: sensor.xtend_lockout_code
        name: Lockout
        color: red
        grid_options:
          columns: 12
        visibility:
          - condition: state
            entity: sensor.xtend_lockout_code
            state_not: ["-", unavailable, unknown]
      - type: tile
        entity: sensor.xtend_systemstatus
        name: System status
      - type: tile
        entity: sensor.xtend_heatdemand_status
        name: Device status
      - type: tile
        entity: sensor.xtend_heatpumpmode
        name: Heat demand
      - type: tile
        entity: sensor.xtend_workingmode
        name: Operational mode
      - type: tile
        entity: sensor.xtend_roomtemperature_1
        name: Room
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_roomtemperature_set_1
        name: Target
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_toutdoor
        name: Outside
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.intergas_xtend
        name: Xtend connection
        icon: mdi:wifi
        state_content:
          - state
          - last_updated
        grid_options:
          columns: 12
      - type: entities
        title: Heat pump summary
        entities:
          - entity: sensor.xtend_startheatingcounter
            name: Compressor starts
          - entity: sensor.xtend_operationheatinghours
            name: Runtime
          - entity: sensor.xtend_poweron_hours
            name: Hours on power
          - entity: sensor.xtend_poweron_number
            name: Power cycles
          - entity: sensor.xtend_startdefrostcounter
            name: Defrost cycles
          - entity: sensor.xtend_software_version
            name: Software version

  - type: grid
    cards:
      - type: heading
        heading: Performance
        icon: mdi:chart-line
      - type: sensor
        entity: sensor.xtend_currentpowerelectric
        name: Electric power
        graph: line
        hours_to_show: 24
      - type: sensor
        entity: sensor.xtend_currenthppowerthermal
        name: Heat pump thermal
        graph: line
        hours_to_show: 24
      - type: gauge
        entity: sensor.xtend_currentcop
        name: Current COP
        unit: " "
        min: 0
        max: 12
        needle: true
        severity:
          green: 5
          yellow: 2.5
          red: 0
      - type: gauge
        entity: sensor.xtend_cop_total
        name: Overall COP
        unit: " "
        min: 0
        max: 12
        needle: true
        severity:
          green: 5
          yellow: 2.5
          red: 0
      - type: tile
        entity: sensor.xtend_thpsupply
        name: Supply
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_deltat
        name: Delta T
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_thpreturn
        name: Return
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_electricenergyheating
        name: Electric energy
      - type: tile
        entity: sensor.xtend_thermalenergyheating
        name: Thermal energy HP
      - type: tile
        entity: sensor.xtend_thermalenergyboiler
        name: Thermal energy boiler
      - type: tile
        entity: sensor.xtend_thermal_total
        name: Thermal energy total
      - type: tile
        entity: sensor.xtend_currentpowerthermal
        name: Thermal power total
      - type: tile
        entity: sensor.xtend_currentboilerpowerthermal
        name: Thermal power boiler

  - type: grid
    cards:
      - type: heading
        heading: Boiler
        icon: mdi:water-boiler
      - type: tile
        entity: sensor.xtreme_burner_status
        name: Flame
      - type: tile
        entity: sensor.xtreme_boiler_ot_modulation_level
        name: Modulation
      - type: tile
        entity: sensor.xtreme_tboilersupply
        name: Supply
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtreme_deltat
        name: Delta T
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtreme_tboilerreturn
        name: Return
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtreme_gas_meter_ch
        name: Gas CH
      - type: tile
        entity: sensor.xtreme_efficiency
        name: Efficiency
      - type: entities
        title: Boiler summary
        entities:
          - entity: sensor.xtreme_boiler_ot_burner_starts
            name: Burner starts
          - entity: sensor.xtreme_boiler_ot_ch_hours
            name: CH hours
          - entity: sensor.xtreme_boiler_ot_dhw_hours
            name: DHW hours
          - entity: sensor.xtreme_boiler_ot_flame_loss
            name: Flame loss
      - type: entities
        title: Boiler live data
        entities:
          - entity: sensor.xtreme_boiler_ot_ch_pressure
            name: CH pressure
          - entity: sensor.xtreme_boiler_ot_ch_water_setpoint
            name: CH target
          - entity: sensor.xtreme_boiler_ot_control_setpoint
            name: Control setpoint
          - entity: sensor.xtreme_boiler_ot_dhw_setpoint
            name: DHW max.
          - entity: sensor.xtreme_boiler_ot_dhw_temperature
            name: DHW actual
          - entity: sensor.xtreme_boiler_ot_dhw_flowrate
            name: DHW flow rate
          - entity: sensor.xtreme_boiler_ot_slave_opentherm_version
            name: OpenTherm version
          - entity: sensor.xtreme_boiler_ot_slave_version
            name: OT slave version

  - type: grid
    cards:
      - type: heading
        heading: Heat pump live data
        icon: mdi:heat-pump
      - type: entities
        entities:
          - entity: sensor.xtend_water_pressure
            name: Pressure
          - entity: sensor.xtend_fsystem
            name: Flow
          - entity: sensor.xtend_requestedtemperature
            name: Setpoint
          - entity: sensor.xtend_exhaustpressure
            name: Discharge gas pressure
          - entity: sensor.xtend_suctionpressure
            name: Suction pressure
          - entity: sensor.xtend_exhausttemperature
            name: Exhaust gas temperature
          - entity: sensor.xtend_suctiontemperature
            name: Suction line gas temperature
          - entity: sensor.xtend_coiltemperature
            name: Coil temperature
          - entity: sensor.xtend_temperaturecondensor_refrigrerant_gas
            name: T condensor gas
          - entity: sensor.xtend_temperaturecondensor_refrigrerant_liquid
            name: T condensor liquid
          - entity: sensor.xtend_suctionoverheat
            name: Suction line overheat
          - entity: sensor.xtend_exhaustoverheat
            name: Discharge overheat
          - entity: sensor.xtend_temperaturesubcooling
            name: Subcooling
          - entity: sensor.xtend_actualfrequency
            name: Compressor frequency
          - entity: sensor.xtend_actualfan1speed
            name: Fan speed
          - entity: sensor.xtend_eevsteps
            name: EEV position
          - entity: sensor.xtend_lockout_code
            name: Lockout code
          - entity: sensor.xtend_notification_code
            name: Notification code
          - entity: sensor.xtend_errorcode
            name: Error code
