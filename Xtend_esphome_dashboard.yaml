title: Xtend Heatpump & Boiler (ESPHome)
path: xtend-esphome
icon: mdi:heating-coil
type: sections
max_columns: 3
sections:
  - type: grid
    cards:
      - type: heading
        heading: Heat pump
        icon: mdi:heat-pump-outline
      # Alerts: only visible when the Xtend reports something
      - type: tile
        entity: sensor.xtend_notification
        name: Notification
        color: amber
        grid_options:
          columns: 12
        visibility:
          - condition: state
            entity: sensor.xtend_notification
            state_not: ["-", unavailable, unknown]
      - type: tile
        entity: sensor.xtend_error
        name: Error
        color: red
        grid_options:
          columns: 12
        visibility:
          - condition: state
            entity: sensor.xtend_error
            state_not: ["-", no_error, unavailable, unknown]
      - type: tile
        entity: sensor.xtend_lockout
        name: Lockout
        color: red
        grid_options:
          columns: 12
        visibility:
          - condition: state
            entity: sensor.xtend_lockout
            state_not: ["-", unavailable, unknown]
      - type: tile
        entity: sensor.xtend_system_status
        name: System status
      - type: tile
        entity: sensor.xtend_heat_demand_status
        name: Device status
      - type: tile
        entity: sensor.xtend_heat_pump_mode
        name: Heat demand
      - type: tile
        entity: sensor.xtend_working_mode
        name: Operational mode
      - type: tile
        entity: sensor.xtend_room_temperature
        name: Room
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_room_setpoint
        name: Target
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_outdoor_temperature
        name: Outside
        grid_options:
          columns: 4
      - type: tile
        entity: binary_sensor.xtend_connection
        name: Xtend connection
        state_content:
          - state
          - last_changed
      - type: tile
        entity: sensor.xtend_wi_fi_signal
        name: Wi-Fi signal
      - type: entities
        title: Heat pump summary
        entities:
          - entity: sensor.xtend_compressor_starts
            name: Compressor starts
          - entity: sensor.xtend_heating_hours
            name: Runtime
          - entity: sensor.xtend_power_on_hours
            name: Hours on power
          - entity: sensor.xtend_power_cycles
            name: Power cycles
          - entity: sensor.xtend_defrost_cycles
            name: Defrost cycles
          - entity: sensor.xtend_software_version
            name: Software version

  - type: grid
    cards:
      - type: heading
        heading: Performance
        icon: mdi:chart-line
      - type: sensor
        entity: sensor.xtend_electric_power
        name: Electric power
        graph: line
        hours_to_show: 24
      - type: sensor
        entity: sensor.xtend_heat_pump_thermal_power
        name: Heat pump thermal
        graph: line
        hours_to_show: 24
      - type: gauge
        entity: sensor.xtend_cop
        name: Current COP
        unit: " "
        min: 0
        max: 12
        needle: true
        severity:
          green: 5
          yellow: 2.5
          red: 0
      - type: gauge
        entity: sensor.xtend_cop_total
        name: Overall COP
        unit: " "
        min: 0
        max: 12
        needle: true
        severity:
          green: 5
          yellow: 2.5
          red: 0
      - type: tile
        entity: sensor.xtend_heat_pump_supply_temperature
        name: Supply
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_heat_pump_delta_t
        name: Delta T
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_heat_pump_return_temperature
        name: Return
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_electric_energy
        name: Electric energy
      - type: tile
        entity: sensor.xtend_thermal_energy_heat_pump
        name: Thermal energy HP
      - type: tile
        entity: sensor.xtend_thermal_energy_boiler
        name: Thermal energy boiler
      - type: tile
        entity: sensor.xtend_thermal_energy_total
        name: Thermal energy total
      - type: tile
        entity: sensor.xtend_total_thermal_power
        name: Thermal power total
      - type: tile
        entity: sensor.xtend_boiler_thermal_power
        name: Thermal power boiler

  - type: grid
    cards:
      - type: heading
        heading: Boiler
        icon: mdi:water-boiler
      - type: tile
        entity: sensor.xtend_burner_status
        name: Flame
      - type: tile
        entity: sensor.xtend_boiler_modulation
        name: Modulation
      - type: tile
        entity: sensor.xtend_boiler_supply_temperature
        name: Supply
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_boiler_delta_t
        name: Delta T
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_boiler_return_temperature
        name: Return
        grid_options:
          columns: 4
      - type: tile
        entity: sensor.xtend_boiler_gas_ch
        name: Gas CH
      - type: tile
        entity: sensor.xtend_boiler_efficiency
        name: Efficiency
      - type: entities
        title: Boiler summary
        entities:
          - entity: sensor.xtend_boiler_burner_starts
            name: Burner starts
          - entity: sensor.xtend_boiler_ch_hours
            name: CH hours
          - entity: sensor.xtend_boiler_dhw_hours
            name: DHW hours
          - entity: sensor.xtend_boiler_flame_loss
            name: Flame loss
      - type: entities
        title: Boiler live data
        entities:
          - entity: sensor.xtend_boiler_ch_pressure
            name: CH pressure
          - entity: sensor.xtend_boiler_ch_setpoint
            name: CH target
          - entity: sensor.xtend_boiler_control_setpoint
            name: Control setpoint
          - entity: sensor.xtend_boiler_dhw_setpoint
            name: DHW max.
          - entity: sensor.xtend_boiler_dhw_temperature
            name: DHW actual
          - entity: sensor.xtend_boiler_dhw_flow
            name: DHW flow rate
          - entity: sensor.xtend_boiler_opentherm_version
            name: OpenTherm version
          - entity: sensor.xtend_boiler_ot_slave_version
            name: OT slave version

  - type: grid
    cards:
      - type: heading
        heading: Heat pump live data
        icon: mdi:heat-pump
      - type: entities
        entities:
          - entity: sensor.xtend_water_pressure
            name: Pressure
          - entity: sensor.xtend_system_flow
            name: Flow
          - entity: sensor.xtend_requested_temperature
            name: Setpoint
          - entity: sensor.xtend_discharge_pressure
            name: Discharge gas pressure
          - entity: sensor.xtend_suction_pressure
            name: Suction pressure
          - entity: sensor.xtend_discharge_temperature
            name: Exhaust gas temperature
          - entity: sensor.xtend_suction_temperature
            name: Suction line gas temperature
          - entity: sensor.xtend_coil_temperature
            name: Coil temperature
          - entity: sensor.xtend_condenser_gas_temperature
            name: T condensor gas
          - entity: sensor.xtend_condenser_liquid_temperature
            name: T condensor liquid
          - entity: sensor.xtend_suction_overheat
            name: Suction line overheat
          - entity: sensor.xtend_discharge_overheat
            name: Discharge overheat
          - entity: sensor.xtend_subcooling
            name: Subcooling
          - entity: sensor.xtend_compressor_frequency
            name: Compressor frequency
          - entity: sensor.xtend_fan_speed
            name: Fan speed
          - entity: sensor.xtend_eev_position
            name: EEV position
          - entity: sensor.xtend_lockout
            name: Lockout code
          - entity: sensor.xtend_notification
            name: Notification code
          - entity: sensor.xtend_error
            name: Error code
