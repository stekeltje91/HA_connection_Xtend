      - name: xtend_RequestedTemperature
        unique_id: 6723eab0-5a27-4af5-a2d3-a5116a827e46
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['7767'] | default(32767) != 32767 }}"
        state: "{{ state_attr('sensor.intergas_xtend', 'stats')['7767'] | default(0) / 100 }}"
