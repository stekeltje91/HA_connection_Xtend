        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['79b3'] | default(32767) != 32767 }}"
        state: "{{ state_attr('sensor.intergas_xtend', 'stats')['79b3'] | default(0) / 100 }}"
        icon: mdi:home-thermometer-outline

      - name: xtend_roomtemperature_set_1
        unique_id: 87fe1484-4509-41b9-bedd-79b6b07cea1d
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['7921'] | default(32767) != 32767 }}"
        state: "{{ state_attr('sensor.intergas_xtend', 'stats')['7921'] | default(0) / 100 }}"
