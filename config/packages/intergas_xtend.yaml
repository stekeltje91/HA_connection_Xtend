      - name: xtend_currentPowerElectric
        unique_id: e891e667-ac7d-4236-99d4-47d623fdaa7a
        device_class: power
        unit_of_measurement: "W"
        state_class: measurement
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['50f2'] | default(32767) != 32767 }}"
        state: "{{ state_attr('sensor.intergas_xtend', 'stats')['50f2'] | default(0) }}"
        icon: mdi:power-plug-outline

      - name: xtend_currentCop
        unique_id: faa0c93c-5f46-4ff7-b9ce-bb609af880de
        unit_of_measurement: "thermal/kWh"
        state_class: measurement
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['5041'] is number }}"
        state: "{{ state_attr('sensor.intergas_xtend', 'stats')['5041'] | default(0) / 10 }}"
        icon: mdi:gauge

      # ---------------------------------------------------------------- Xtend energy
      # device_class energy + total_increasing: usable in the Energy dashboard
      - name: xtend_electricEnergyHeating
        unique_id: 10bbb3f8-c6a8-4496-afe9-a070189b79a0
        device_class: energy
        unit_of_measurement: "kWh"
        state_class: total_increasing
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['63b3'] is number }}"
        state: "{{ state_attr('sensor.intergas_xtend', 'stats')['63b3'] | default(0) }}"
        icon: mdi:power-plug-outline

      - name: xtend_thermalEnergyHeating
        unique_id: 090afc83-ce71-408d-8f64-33f2e5ddcd5d
        device_class: energy
        unit_of_measurement: "kWh"
        state_class: total_increasing
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['63f0'] is number }}"
        state: "{{ state_attr('sensor.intergas_xtend', 'stats')['63f0'] | default(0) }}"
        icon: mdi:thermometer-lines

      - name: xtend_thermalEnergyBoiler
        unique_id: 0f8df2d1-034f-4736-9bb0-01923ae76bbd
        device_class: energy
        unit_of_measurement: "kWh"
        state_class: total_increasing
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['63df'] is number }}"
        state: "{{ state_attr('sensor.intergas_xtend', 'stats')['63df'] | default(0) }}"
        icon: mdi:thermometer-lines

