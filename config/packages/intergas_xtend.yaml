# Intergas Xtend hybrid heat pump (+ OpenTherm boiler data) for Home Assistant
#
# Home Assistant package: copy this file to /config/packages/ and enable packages in
# configuration.yaml (see README). Home Assistant must be connected to the Xtend Wi-Fi
# access point (10.20.30.1).
#
# All data comes from ONE request to the Xtend API every 2 minutes. Every value sensor
# has an availability template, so when the Xtend is unreachable the sensors become
# 'unavailable' instead of filling the log with template errors. 32767 is the Xtend's
# "no value" for signed 16-bit fields and is treated as unavailable.
#
# Not requested on purpose:
#   848e (boiler modulation level set) - breaks the API connection (upstream issue #9)

rest:
  - resource: http://10.20.30.1/api/stats/values?fields=4133,47e0,503e,5041,5077,5088,50f2,6280,629c,62d1,62e7,63b3,63df,63f0,6505,6578,6579,65a7,65b0,65c1,65d9,6a53,6a8e,6ac5,6c26,6c33,6c53,6c66,6c8a,6ceb,6cfb,7160,71a7,7767,777d,77dd,7921,7940,79b3,7e2c,7e51,7ed3,623c,625b,7191,7e7a,8434,844c,84d1,8e00,8e18,8e1e,8e37,8e7f,8e8f,8ecb,8ecc,8edb,8ef9
    scan_interval: 120
    timeout: 30
    sensor:
      - name: Intergas_Xtend
        unique_id: 71298044-d08d-494c-a415-41a72b4a3aaa
        value_template: "Ok"
        json_attributes:
          - stats

template:
  - sensor:
      # ---------------------------------------------------------------- Xtend status
      - name: xtend_errorCode
        unique_id: a86fc7a8-418a-464e-95de-8534ca47b0af
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['4133'] is number }}"
        state: >
          {% set raw_value = state_attr('sensor.intergas_xtend', 'stats')['4133'] | default(0) %}
          {% set errors = {
            0: '-',
            1: 'defrost_failed',
            2: 'low_pressure',
            3: 'high_pressure',
            4: 'compressor_outside_op_range',
            5: 'exhaust_temp_too_high',
            6: 'condensor_temp_too_high',
            7: 'outdoorunit_specific_auto_restart',
            8: 'outdoorunit_specific_locked',
            9: 'outdoorunit_control_guard',
            10: 'water_flow_too_low',
            11: 'water_flow_too_low_defrost',
            12: 'condensor_gas_too_low',
            13: 'no_toutdoor_sensor',
            14: 'pumpdown_failed',
            15: 'dsh_too_low',
            16: 'ssh_too_low',
            17: 'ssh_too_high',
            18: 'cooling_mode_temps',
            19: 'condensor_liquid_sensor',
            20: 'xtp_device_water_inlet',
            21: 'xtp_device_water_outlet',
            22: 'xtp_device_refrigerant_liquid',
            23: 'xtp_device_refrigerant_gas',
            128: 'ac_bus_voltage_high',
            129: 'ac_bus_voltage_low',
            130: 'dc_bus_overvoltage',
            131: 'compressor_overcurrent_hardware',
            132: 'compressor_overcurrent_firmware',
            133: 'ac_input_overcurrent_hardware',
            134: 'ac_input_overcurrent_firmware',
            135: 'compressor_current_overload',
            136: 'phase_loss_loss_of_synchronism',
            137: 'ipm_temp_protection',
            138: 'outdoor_dc_fan_fault',
            139: 'suction_temp_sensor_error',
            140: 'odu_discharge_temp_sensor_error',
            141: 'odu_coil_temp_sensor_error',
            142: 'ambient_temp_sensor_error',
            143: 'discharge_temp_high_error',
            144: 'condensing_temp_high_error',
            145: 'odu_idu_communication_error',
            146: 'dc_bus_undervoltage',
            255: 'no_error',
            65535: 'unconnected'
          } %}
          {{ errors.get(raw_value, 'Unknown (' ~ raw_value ~ ')') }}
        icon: >
          {% if states('sensor.xtend_errorcode') in ['no_error', '-'] %}
            mdi:check-circle-outline
          {% else %}
            mdi:alert-circle-outline
          {% endif %}

      - name: xtend_software_version
        unique_id: f2f4dfc0-0c38-4350-8463-7c1809a77dd1
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['47e0'] is string }}"
        state: "{{ state_attr('sensor.intergas_xtend', 'stats')['47e0'] | default('') }}"
        icon: mdi:checkbox-multiple-marked-circle-outline

      - name: xtend_heatpumpMode
        unique_id: 922f22d6-95df-44c3-9404-b37971155faa
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['777d'] is number }}"
        state: >
          {% set raw_value = state_attr('sensor.intergas_xtend', 'stats')['777d'] | default(255) %}
          {% set modes = {
            0: 'Dhw',
            1: 'Heating',
            2: 'Cooling',
            253: 'Pumpdown',
            254: 'Off',
            255: 'Undefined'
          } %}
          {{ modes.get(raw_value, 'Unknown (' ~ raw_value ~ ')') }}
        icon: >
          {% set mode = states('sensor.xtend_heatpumpmode') %}
          {% if mode == 'Heating' %}
            mdi:fire
          {% elif mode == 'Cooling' %}
            mdi:snowflake
          {% elif mode == 'Dhw' %}
            mdi:shower
          {% elif mode == 'Off' %}
            mdi:power-off
          {% elif mode == 'Pumpdown' %}
            mdi:pump
          {% elif mode == 'Undefined' %}
            mdi:help-circle
          {% else %}
            mdi:message-badge
          {% endif %}

      - name: xtend_workingMode
        unique_id: 8db83967-1b28-4803-bfbc-d2d07b3e5978
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['6578'] is number }}"
        state: >
          {% set raw_value = state_attr('sensor.intergas_xtend', 'stats')['6578'] | default(255) %}
          {% set modes = {
            0: 'Cooling',
            1: 'Heating',
            2: 'Defrosting',
            3: 'Pumpdown',
            255: 'Undefined'
          } %}
          {{ modes.get(raw_value, 'Unknown (' ~ raw_value ~ ')') }}
        icon: >
          {% set mode = states('sensor.xtend_workingmode') %}
          {% if mode == 'Heating' %}
            mdi:fire
          {% elif mode == 'Cooling' %}
            mdi:snowflake
          {% elif mode == 'Defrosting' %}
            mdi:snowflake-remove
          {% elif mode == 'Pumpdown' %}
            mdi:pump
          {% elif mode == 'Undefined' %}
            mdi:help-circle
          {% else %}
            mdi:message-reply-outline
          {% endif %}

      - name: xtend_notification_code
        unique_id: aa33bdb8-9efe-4057-8838-6270c7b32474
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['7940'] is number }}"
        state: >
          {% set raw_value = state_attr('sensor.intergas_xtend', 'stats')['7940'] | default(255) %}
          {% set notifications = {
            0: 'PARAMETER_OUT_OF_BOUNDS',
            1: 'LOW_PRESSURE',
            2: 'NO_PRESSURE',
            8: 'XTP_FAULT_HP_OFF',
            9: 'HEATPUMP_SELECT_PHASE',
            10: 'HEATPUMP_REMOTE_OF',
            11: 'HEATPUMP_FAILED',
            12: 'KWH_METER',
            13: 'CONDENSOR_OVERHEAT',
            14: 'ROOMTHERM_FAILED',
            15: 'CRANKHEATER',
            16: 'WATER_TEMP_SENSORS',
            18: 'EEPROM_BROKEN',
            19: 'BMM_BROKEN',
            20: 'NO_FLOW_DHW_CIRCUIT',
            21: 'NO_FLOW_CH_CIRCUIT',
            22: 'FLOW_CONTROL_DISABLED',
            23: 'COMMISSIONING_LOW_FLOW',
            26: 'RTC_TIME_INVALID',
            27: 'RTC_CLOCK',
            31: '_UNKNOWN',
            32: 'DEFROST_TIMEOUT',
            33: 'DEFROST_MONITOR_TIMEOUT',
            37: 'SENSOR_HP_RETURN',
            38: 'SENSOR_HP_SUPPLY',
            39: 'SENSOR_SYSTEM_SUPPLY',
            40: 'SENSOR_OUTDOOR',
            41: 'SENSOR_CONDENSOR_REF_LIQ',
            42: 'SENSOR_CONDENSOR_REF_GAS',
            46: 'SENSOR_BOILER_RETURN',
            47: 'SENSOR_BOILER_SUPPLY',
            48: 'BOILER_FLOW_TOO_HIGH',
            49: 'BOILER_FLOW_TOO_LOW',
            50: 'BOILER_FLOW_REVERSED',
            51: 'BOILER_FAULT',
            52: 'BOILER_OPENTHERM_FAULT',
            53: 'BOILER_BOILER_SETTING_MAX',
            54: 'BOILER_NO_CH_REPONSE',
            60: 'THERMOSTAT_VERSION',
            73: 'REFRIDGERANT_LOW',
            255: '-'
          } %}
          {{ notifications.get(raw_value, 'Unknown (' ~ raw_value ~ ')') }}
        icon: >
          {% set code = states('sensor.xtend_notification_code') %}
          {% set critical_codes = ['LOW_PRESSURE', 'NO_PRESSURE', 'HEATPUMP_FAILED', 'CONDENSOR_OVERHEAT', 'BOILER_FAULT', 'REFRIDGERANT_LOW'] %}
          {% set sensor_codes = ['SENSOR_HP_RETURN', 'SENSOR_HP_SUPPLY', 'SENSOR_SYSTEM_SUPPLY', 'SENSOR_OUTDOOR', 'SENSOR_CONDENSOR_REF_LIQ', 'SENSOR_CONDENSOR_REF_GAS', 'SENSOR_BOILER_RETURN', 'SENSOR_BOILER_SUPPLY', 'WATER_TEMP_SENSORS'] %}
          {% set boiler_codes = ['BOILER_FLOW_TOO_HIGH', 'BOILER_FLOW_TOO_LOW', 'BOILER_FLOW_REVERSED', 'BOILER_OPENTHERM_FAULT', 'BOILER_NO_CH_REPONSE'] %}
          {% if code in critical_codes %}
            mdi:alert-octagon
          {% elif code in sensor_codes %}
            mdi:thermometer-alert
          {% elif code in boiler_codes %}
            mdi:fire-alert
          {% elif code == '-' %}
            mdi:bell-off
          {% else %}
            mdi:bell-outline
          {% endif %}

      - name: xtend_lockout_code
        unique_id: 7698c5e1-8f38-4367-99f8-71d55db183a0
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['7e2c'] is number }}"
        state: >
          {% set raw_value = state_attr('sensor.intergas_xtend', 'stats')['7e2c'] | default(255) %}
          {% set locks = {
            1: 'CH_PUMP',
            2: 'DHW_PUMP',
            3: 'CONDENSOR_OVERHEAT',
            9: 'ERROR_DEVICE',
            10: 'DEFROST_WATER_TEMP_LOW',
            18: 'HEATPUMP_TYPE_UNCONFIGURED',
            19: 'BMM_ILLIGAL_SERIAL',
            20: 'STORAGEHANDLER_SYNC',
            22: 'FIRMWARE_COMPATIBILITY',
            23: 'XTP_DEVICE_INTERNAL_FAULT',
            24: 'XTP_DEVICE_CONFIG_FAULT',
            25: 'XTP_COMMUNICATION_FAULT',
            26: 'XTP_START_FAULT',
            31: 'ERROR_UNKNOWN',
            37: 'SENSOR_HP_RETURN',
            38: 'SENSOR_HP_SUPPLY',
            39: 'SENSOR_SYSTEM_SUPPLY',
            40: 'SENSOR_OUTDOOR',
            42: 'SENSOR_CONDENSOR_REF_GAS',
            46: 'SENSOR_BOILER_RETURN',
            47: 'SENSOR_BOILER_SUPPLY',
            50: 'CODE_THERMOSTAT_HEATPUMP',
            51: 'CODE_THERMOSTAT_BOILER',
            254: 'BYPASS_MODE_ACTIVE',
            255: '-'
          } %}
          {{ locks.get(raw_value, 'Unknown (' ~ raw_value ~ ')') }}
        icon: >
          {% set code = states('sensor.xtend_lockout_code') %}
          {% set pump_codes = ['CH_PUMP', 'DHW_PUMP'] %}
          {% set sensor_codes = ['SENSOR_HP_RETURN', 'SENSOR_HP_SUPPLY', 'SENSOR_SYSTEM_SUPPLY', 'SENSOR_OUTDOOR', 'SENSOR_CONDENSOR_REF_GAS', 'SENSOR_BOILER_RETURN', 'SENSOR_BOILER_SUPPLY'] %}
          {% set config_codes = ['HEATPUMP_TYPE_UNCONFIGURED', 'BMM_ILLIGAL_SERIAL', 'FIRMWARE_COMPATIBILITY', 'XTP_DEVICE_CONFIG_FAULT'] %}
          {% if code == '-' %}
            mdi:shield-check
          {% elif code in pump_codes %}
            mdi:pump-alert
          {% elif code in sensor_codes %}
            mdi:thermometer-alert
          {% elif code in config_codes %}
            mdi:cog-transfer-outline
          {% elif code == 'CONDENSOR_OVERHEAT' %}
            mdi:fire-alert
          {% else %}
            mdi:alert-outline
          {% endif %}

      - name: xtend_heatdemand_status
        unique_id: 18cc6f8b-1cd2-4ae7-97b3-1e06336ec3e0
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['7e51'] is number }}"
        state: >
          {% set raw_value = state_attr('sensor.intergas_xtend', 'stats')['7e51'] | default(255) %}
          {% set statuses = {
            0: 'opentherm',
            15: 'boiler_ext',
            24: 'frost',
            37: 'ch_rf',
            85: 'sensortest',
            86: 'commissioning',
            87: 'crankheating',
            102: 'ch',
            103: 'ch_wait',
            104: 'defrosting',
            117: 'starting_cooling',
            118: 'cooling',
            119: 'cooling_wait',
            126: 'standby',
            127: 'off',
            153: 'postrun_boiler',
            170: 'service',
            189: 'postrun_cooling',
            204: 'dhw',
            205: 'dhw_hreco',
            206: 'legionella-run',
            207: 'waiting_for_xtore_heating',
            230: 'starting_ch',
            231: 'postrun_ch',
            240: 'boiler_int',
            255: 'heatup'
          } %}
          {{ statuses.get(raw_value, 'Unknown (' ~ raw_value ~ ')') }}
        icon: >
          {% set status = states('sensor.xtend_heatdemand_status') %}
          {% set heating_states = ['ch', 'ch_wait', 'starting_ch', 'postrun_ch', 'boiler_int', 'boiler_ext', 'opentherm', 'crankheating', 'heatup', 'legionella-run', 'waiting_for_xtore_heating'] %}
          {% set cooling_states = ['cooling', 'cooling_wait', 'starting_cooling', 'postrun_cooling'] %}
          {% set dhw_states = ['dhw', 'dhw_hreco'] %}
          {% set service_states = ['service', 'commissioning', 'sensortest'] %}
          {% if status in heating_states %}
            mdi:fire
          {% elif status in cooling_states %}
            mdi:snowflake
          {% elif status in dhw_states %}
            mdi:shower
          {% elif status == 'frost' %}
            mdi:snowflake-alert
          {% elif status in ['off', 'standby'] %}
            mdi:power-off
          {% elif status == 'defrosting' %}
            mdi:snowflake-remove
          {% elif status in service_states %}
            mdi:wrench-clock
          {% else %}
            mdi:message-badge-outline
          {% endif %}

      - name: xtend_systemStatus
        unique_id: 8aa053b2-1a08-4a5d-abda-fa48b1f8bdbf
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['77dd'] is number }}"
        state: >
          {% set raw_value = state_attr('sensor.intergas_xtend', 'stats')['77dd'] | default(255) %}
          {% set statuses = {
            0: 'Monitor lockout',
            1: 'Pump Venting',
            2: 'Service',
            3: 'Defrost',
            4: 'Domestic Hot Water (DHW)',
            5: 'Roomheating Comfort',
            6: 'Roomheating Eco',
            7: 'Roomcooling',
            8: 'DHW Heatexchanger',
            9: 'Floor heating protocol',
            12: 'Anti freeze',
            13: 'Pump maintenance',
            14: 'Idle',
            255: 'No task'
          } %}
          {{ statuses.get(raw_value, 'Unknown (' ~ raw_value ~ ')') }}
        icon: >
          {% set status = states('sensor.xtend_systemstatus') %}
          {% if status in ['Roomheating Comfort', 'Roomheating Eco', 'Floor heating protocol'] %}
            mdi:fire
          {% elif status == 'Roomcooling' %}
            mdi:snowflake
          {% elif status in ['Domestic Hot Water (DHW)', 'DHW Heatexchanger'] %}
            mdi:shower
          {% elif status in ['Pump Venting', 'Pump maintenance', 'Service'] %}
            mdi:wrench
          {% elif status == 'Defrost' %}
            mdi:snowflake-remove
          {% elif status == 'Anti freeze' %}
            mdi:snowflake-alert
          {% elif status == 'Monitor lockout' %}
            mdi:lock-alert
          {% elif status in ['Idle', 'No task'] %}
            mdi:power-off
          {% else %}
            mdi:power
          {% endif %}

      # ----------------------------------------------------------------- Xtend power
      - name: xtend_currentHpPowerThermal
        unique_id: 2d3ec316-ab0e-4e95-b909-2a80110f149b
        device_class: power
        unit_of_measurement: "kW"
        state_class: measurement
        availability: "{{ state_attr('sensor.intergas_xtend', 'stats')['503e'] | default(32767) != 32767 }}"
        state: "{{ state_attr('sensor.intergas_xtend', 'stats')['503e'] | default(0) / 1000 }}"
        icon: mdi:thermometer-lines

      - name: xtend_currentPowerThermal
        unique_id: 43815c81-3397-4998-87d0-f983db96b1e6
        device_class: power
        unit_of_measurement: "kW"
