            1: 'Interpurge',
            2: 'Postpurge',
            4: 'Prepurge',
            8: 'Ignition',
            16: 'Waiting',
            32: 'Running',
            64: 'Rest',
            128: 'Lockout'
          } %}
          {{ statuses.get(raw_value, 'Unknown (' ~ raw_value ~ ')') }}
        icon: >
          {% set status = states('sensor.xtreme_burner_status') %}
          {% if status == 'Lockout' %}
