# Intergas Xtend bridge for Home Assistant (ESPHome)
#
# Hardware: WT32-ETH01 (Wireless-Tag). No USB port: the first install needs a 3.3 V
# USB-TTL adapter (see README). Later updates go over the network.
#   Ethernet -> your home network (Home Assistant talks to the bridge over the cable)
#   Wi-Fi    -> the Xtend access point "Xtend_xxxxxxxxxx" (10.20.30.1)
#
# Every poll_interval (default 2 minutes) the bridge reads 59 fields from the Xtend API and publishes them as
# native ESPHome sensors. 32767 (the Xtend "no value" for 16-bit fields) becomes unknown.
# A failed poll is retried after 30 seconds, so the Xtend Wi-Fi never goes long without a
# request (it switches off after a period of inactivity). After two failed polls in a row
# all values become unknown/unavailable until the Xtend answers again. Field 848e is not requested: it breaks the API connection.
#
# Secrets (ESPHome Device Builder > Secrets): xtend_wifi_ssid, xtend_wifi_password,
# xtend_api_key. See secrets.example.yaml.

substitutions:
  name: xtend
  friendly_name: Xtend
  # Keep this well below 5 minutes, or the Xtend may switch its Wi-Fi off.
  poll_interval: 2min
  xtend_url: http://10.20.30.1/api/stats/values?fields=62d1,79b3,7921,7767,62e7,6280,6505,65c1,65d9,6c26,6ceb,6c33,6cfb,6c53,7ed3,6579,65b0,629c,65a7,6c8a,6c66,50f2,503e,5077,5088,5041,63b3,63f0,63df,6a8e,6a53,6ac5,7160,71a7,625b,623c,8434,8e8f,8edb,8ecb,8e7f,84d1,844c,7191,8ef9,8e37,8e00,8e18,8e1e,8ecc,77dd,7e51,777d,6578,7940,7e2c,4133,7e7a,47e0

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: Intergas Xtend bridge (Wi-Fi to Xtend, Ethernet to home network)
  project:
    name: stekeltje91.xtend-bridge
    version: "1.0.0"

esp32:
  board: wt32-eth01
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret xtend_api_key

ota:
  - platform: esphome
    encryption:

# Ethernet is the main interface (Home Assistant API, default route); Wi-Fi is only used
# for the Xtend network.
network:
  priority:
    - ethernet
    - wifi

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16

wifi:
  ssid: !secret xtend_wifi_ssid
  password: !secret xtend_wifi_password
  power_save_mode: none
  # Keep running when the Xtend Wi-Fi is off (press the button on the Xtend to turn it on).
  reboot_timeout: 0s
  on_connect:
    - script.execute: xtend_poll

http_request:
  timeout: 10s
  verify_ssl: false

globals:
  - id: xtend_failures
    type: int
    initial_value: "0"

interval:
  - interval: ${poll_interval}
    then:
      - script.execute: xtend_poll

script:
  - id: xtend_poll
    mode: single
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - http_request.get:
                url: ${xtend_url}
                capture_response: true
                max_response_buffer_size: 4kB
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          ESP_LOGW("xtend", "Xtend API answered HTTP %d", response->status_code);
                          id(xtend_poll_failed).execute();
                          id(xtend_retry).execute();
                          return;
                        }
                        if (json::parse_json(body, [](JsonObject root) -> bool {
                          JsonObject s = root["stats"];
                          if (s.isNull()) return false;
                          // Scaled value of a field; NAN when missing or 32767 (Xtend "no value" for 16-bit fields).
                          auto num = [&s](const char *key, float scale, bool int16) -> float {
                            JsonVariant v = s[key];
                            if (!v.is<double>()) return NAN;
                            double raw = v.as<double>();
                            if (int16 && raw == 32767) return NAN;
                            return raw * scale;
                          };
                          auto code = [&s](const char *key) -> long {
                            JsonVariant v = s[key];
                            return v.is<long>() ? v.as<long>() : -1;
                          };
                          auto label = [](long raw, std::initializer_list<std::pair<long, const char *>> names) -> std::string {
                            if (raw < 0) return "unavailable";
                            for (const auto &n : names)
                              if (n.first == raw) return n.second;
                            return "Unknown (" + std::to_string(raw) + ")";
                          };

                          id(t_outdoor).publish_state(num("62d1", 0.01f, true));
                          id(t_room).publish_state(num("79b3", 0.01f, true));
                          id(t_room_set).publish_state(num("7921", 0.01f, true));
                          id(t_requested).publish_state(num("7767", 0.01f, true));
                          id(t_hp_supply).publish_state(num("62e7", 0.01f, true));
                          id(t_hp_return).publish_state(num("6280", 0.01f, true));
                          id(t_suction).publish_state(num("6505", 0.01f, true));
                          id(t_coil).publish_state(num("65c1", 0.01f, true));
                          id(t_discharge).publish_state(num("65d9", 0.01f, true));
                          id(t_cond_gas).publish_state(num("6c26", 0.01f, true));
                          id(t_cond_liquid).publish_state(num("6ceb", 0.01f, true));
                          id(dt_discharge_overheat).publish_state(num("6c33", 0.01f, true));
                          id(dt_suction_overheat).publish_state(num("6cfb", 0.01f, true));
                          id(dt_subcooling).publish_state(num("6c53", 0.01f, true));
                          id(p_water).publish_state(num("7ed3", 0.01f, true));
                          id(p_suction).publish_state(num("6579", 0.01f, true));
                          id(p_discharge).publish_state(num("65b0", 0.01f, true));
                          id(flow_system).publish_state(num("629c", 0.01f, true));
                          id(compressor_frequency).publish_state(num("65a7", 0.01f, true));
                          id(fan_speed).publish_state(num("6c8a", 1.0f, true));
                          id(eev_position).publish_state(num("6c66", 1.0f, true));
                          id(power_electric).publish_state(num("50f2", 1.0f, true));
                          id(power_hp_thermal).publish_state(num("503e", 0.001f, true));
                          id(power_thermal).publish_state(num("5077", 0.001f, true));
                          id(power_boiler_thermal).publish_state(num("5088", 0.001f, true));
                          id(cop).publish_state(num("5041", 0.1f, false));
                          id(energy_electric).publish_state(num("63b3", 1.0f, false));
                          id(energy_thermal_hp).publish_state(num("63f0", 1.0f, false));
                          id(energy_thermal_boiler).publish_state(num("63df", 1.0f, false));
                          id(compressor_starts).publish_state(num("6a8e", 1.0f, false));
                          id(defrost_cycles).publish_state(num("6a53", 1.0f, false));
                          id(heating_hours).publish_state(num("6ac5", 1.0f, false));
                          id(power_cycles).publish_state(num("7160", 1.0f, false));
                          id(power_on_hours).publish_state(num("71a7", 1.0f, false));
                          id(t_boiler_supply).publish_state(num("625b", 0.01f, true));
                          id(t_boiler_return).publish_state(num("623c", 0.01f, true));
                          id(boiler_control_setpoint).publish_state(num("8434", 0.01f, true));
                          id(boiler_ch_setpoint).publish_state(num("8e8f", 0.01f, true));
                          id(boiler_dhw_temperature).publish_state(num("8edb", 0.01f, true));
                          id(boiler_dhw_setpoint).publish_state(num("8ecb", 0.01f, true));
                          id(boiler_dhw_flow).publish_state(num("8e7f", 0.01f, true));
                          id(boiler_modulation).publish_state(num("84d1", 0.01f, true));
                          id(boiler_ch_pressure).publish_state(num("844c", 0.01f, true));
                          id(boiler_gas_ch).publish_state(num("7191", 0.0001f, false));
                          id(boiler_ch_hours).publish_state(num("8ef9", 1.0f, false));
                          id(boiler_dhw_hours).publish_state(num("8e37", 1.0f, false));
                          id(boiler_burner_starts).publish_state(num("8e00", 1.0f, false));
                          id(boiler_flame_loss).publish_state(num("8e18", 1.0f, false));
                          id(boiler_ot_slave_version).publish_state(num("8e1e", 1.0f, false));
                          id(boiler_opentherm_version).publish_state(num("8ecc", 1.0f, false));

                          id(system_status).publish_state(label(code("77dd"),
                                  {{0, "Monitor lockout"}, {1, "Pump Venting"}, {2, "Service"}, {3, "Defrost"}, {4, "Domestic Hot Water (DHW)"}, {5, "Roomheating Comfort"}, {6, "Roomheating Eco"}, {7, "Roomcooling"}, {8, "DHW Heatexchanger"}, {9, "Floor heating protocol"}, {12, "Anti freeze"}, {13, "Pump maintenance"}, {14, "Idle"}, {255, "No task"}}));
                          id(heat_demand_status).publish_state(label(code("7e51"),
                                  {{0, "opentherm"}, {15, "boiler_ext"}, {24, "frost"}, {37, "ch_rf"}, {85, "sensortest"}, {86, "commissioning"}, {87, "crankheating"}, {102, "ch"}, {103, "ch_wait"}, {104, "defrosting"}, {117, "starting_cooling"}, {118, "cooling"}, {119, "cooling_wait"}, {126, "standby"}, {127, "off"}, {153, "postrun_boiler"}, {170, "service"}, {189, "postrun_cooling"}, {204, "dhw"}, {205, "dhw_hreco"}, {206, "legionella-run"}, {207, "waiting_for_xtore_heating"}, {230, "starting_ch"}, {231, "postrun_ch"}, {240, "boiler_int"}, {255, "heatup"}}));
                          id(heat_pump_mode).publish_state(label(code("777d"),
                                  {{0, "Dhw"}, {1, "Heating"}, {2, "Cooling"}, {253, "Pumpdown"}, {254, "Off"}, {255, "Undefined"}}));
                          id(working_mode).publish_state(label(code("6578"),
                                  {{0, "Cooling"}, {1, "Heating"}, {2, "Defrosting"}, {3, "Pumpdown"}, {255, "Undefined"}}));
                          id(notification).publish_state(label(code("7940"),
                                  {{0, "PARAMETER_OUT_OF_BOUNDS"}, {1, "LOW_PRESSURE"}, {2, "NO_PRESSURE"}, {8, "XTP_FAULT_HP_OFF"}, {9, "HEATPUMP_SELECT_PHASE"}, {10, "HEATPUMP_REMOTE_OF"}, {11, "HEATPUMP_FAILED"}, {12, "KWH_METER"}, {13, "CONDENSOR_OVERHEAT"}, {14, "ROOMTHERM_FAILED"}, {15, "CRANKHEATER"}, {16, "WATER_TEMP_SENSORS"}, {18, "EEPROM_BROKEN"}, {19, "BMM_BROKEN"}, {20, "NO_FLOW_DHW_CIRCUIT"}, {21, "NO_FLOW_CH_CIRCUIT"}, {22, "FLOW_CONTROL_DISABLED"}, {23, "COMMISSIONING_LOW_FLOW"}, {26, "RTC_TIME_INVALID"}, {27, "RTC_CLOCK"}, {31, "_UNKNOWN"}, {32, "DEFROST_TIMEOUT"}, {33, "DEFROST_MONITOR_TIMEOUT"}, {37, "SENSOR_HP_RETURN"}, {38, "SENSOR_HP_SUPPLY"}, {39, "SENSOR_SYSTEM_SUPPLY"}, {40, "SENSOR_OUTDOOR"}, {41, "SENSOR_CONDENSOR_REF_LIQ"}, {42, "SENSOR_CONDENSOR_REF_GAS"}, {46, "SENSOR_BOILER_RETURN"}, {47, "SENSOR_BOILER_SUPPLY"}, {48, "BOILER_FLOW_TOO_HIGH"}, {49, "BOILER_FLOW_TOO_LOW"}, {50, "BOILER_FLOW_REVERSED"}, {51, "BOILER_FAULT"}, {52, "BOILER_OPENTHERM_FAULT"}, {53, "BOILER_BOILER_SETTING_MAX"}, {54, "BOILER_NO_CH_REPONSE"}, {60, "THERMOSTAT_VERSION"}, {73, "REFRIDGERANT_LOW"}, {255, "-"}}));
                          id(lockout).publish_state(label(code("7e2c"),
                                  {{1, "CH_PUMP"}, {2, "DHW_PUMP"}, {3, "CONDENSOR_OVERHEAT"}, {9, "ERROR_DEVICE"}, {10, "DEFROST_WATER_TEMP_LOW"}, {18, "HEATPUMP_TYPE_UNCONFIGURED"}, {19, "BMM_ILLIGAL_SERIAL"}, {20, "STORAGEHANDLER_SYNC"}, {22, "FIRMWARE_COMPATIBILITY"}, {23, "XTP_DEVICE_INTERNAL_FAULT"}, {24, "XTP_DEVICE_CONFIG_FAULT"}, {25, "XTP_COMMUNICATION_FAULT"}, {26, "XTP_START_FAULT"}, {31, "ERROR_UNKNOWN"}, {37, "SENSOR_HP_RETURN"}, {38, "SENSOR_HP_SUPPLY"}, {39, "SENSOR_SYSTEM_SUPPLY"}, {40, "SENSOR_OUTDOOR"}, {42, "SENSOR_CONDENSOR_REF_GAS"}, {46, "SENSOR_BOILER_RETURN"}, {47, "SENSOR_BOILER_SUPPLY"}, {50, "CODE_THERMOSTAT_HEATPUMP"}, {51, "CODE_THERMOSTAT_BOILER"}, {254, "BYPASS_MODE_ACTIVE"}, {255, "-"}}));
                          id(error).publish_state(label(code("4133"),
                                  {{0, "-"}, {1, "defrost_failed"}, {2, "low_pressure"}, {3, "high_pressure"}, {4, "compressor_outside_op_range"}, {5, "exhaust_temp_too_high"}, {6, "condensor_temp_too_high"}, {7, "outdoorunit_specific_auto_restart"}, {8, "outdoorunit_specific_locked"}, {9, "outdoorunit_control_guard"}, {10, "water_flow_too_low"}, {11, "water_flow_too_low_defrost"}, {12, "condensor_gas_too_low"}, {13, "no_toutdoor_sensor"}, {14, "pumpdown_failed"}, {15, "dsh_too_low"}, {16, "ssh_too_low"}, {17, "ssh_too_high"}, {18, "cooling_mode_temps"}, {19, "condensor_liquid_sensor"}, {20, "xtp_device_water_inlet"}, {21, "xtp_device_water_outlet"}, {22, "xtp_device_refrigerant_liquid"}, {23, "xtp_device_refrigerant_gas"}, {128, "ac_bus_voltage_high"}, {129, "ac_bus_voltage_low"}, {130, "dc_bus_overvoltage"}, {131, "compressor_overcurrent_hardware"}, {132, "compressor_overcurrent_firmware"}, {133, "ac_input_overcurrent_hardware"}, {134, "ac_input_overcurrent_firmware"}, {135, "compressor_current_overload"}, {136, "phase_loss_loss_of_synchronism"}, {137, "ipm_temp_protection"}, {138, "outdoor_dc_fan_fault"}, {139, "suction_temp_sensor_error"}, {140, "odu_discharge_temp_sensor_error"}, {141, "odu_coil_temp_sensor_error"}, {142, "ambient_temp_sensor_error"}, {143, "discharge_temp_high_error"}, {144, "condensing_temp_high_error"}, {145, "odu_idu_communication_error"}, {146, "dc_bus_undervoltage"}, {255, "no_error"}, {65535, "unconnected"}}));
                          id(burner_status).publish_state(label(code("7e7a"),
                                  {{0, "Startup"}, {1, "Interpurge"}, {2, "Postpurge"}, {4, "Prepurge"}, {8, "Ignition"}, {16, "Waiting"}, {32, "Running"}, {64, "Rest"}, {128, "Lockout"}}));
                          id(software_version).publish_state(s["47e0"].is<const char *>() ? s["47e0"].as<const char *>() : "unavailable");

                          // Calculated
                          id(cop_total).publish_state(id(energy_electric).state > 0.1f ? id(energy_thermal_hp).state / id(energy_electric).state : NAN);
                          id(dt_hp).publish_state(id(t_hp_supply).state - id(t_hp_return).state);
                          id(energy_thermal_total).publish_state(id(energy_thermal_hp).state + id(energy_thermal_boiler).state);
                          id(dt_boiler).publish_state(id(t_boiler_supply).state - id(t_boiler_return).state);
                          id(boiler_efficiency).publish_state(id(boiler_gas_ch).state > 0 ? id(energy_thermal_boiler).state / id(boiler_gas_ch).state : NAN);
                          return true;
                        })) {
                          id(xtend_failures) = 0;
                          id(xtend_connection).publish_state(true);
                        } else {
                          ESP_LOGW("xtend", "Unexpected answer from the Xtend API");
                          id(xtend_poll_failed).execute();
                          id(xtend_retry).execute();
                        }
                on_error:
                  then:
                    - script.execute: xtend_poll_failed
                    - script.execute: xtend_retry
          else:
            - script.execute: xtend_poll_failed

  - id: xtend_poll_failed
    then:
      - lambda: |-
          // Tolerate one missed poll, then mark all Xtend values unknown.
          if (++id(xtend_failures) < 2) return;
          id(xtend_connection).publish_state(false);
          for (auto *s : App.get_sensors())
            if (s != id(xtend_wifi_signal)) s->publish_state(NAN);
          for (auto *t : App.get_text_sensors())
            t->publish_state("unavailable");

  # Try again 30 seconds after a failed request instead of waiting a full poll_interval.
  - id: xtend_retry
    mode: restart
    then:
      - delay: 30s
      - script.execute: xtend_poll

sensor:
  - platform: wifi_signal
    id: xtend_wifi_signal
    name: Wi-Fi signal
    update_interval: 60s
    entity_category: diagnostic

  # ---- Heat pump
  - platform: template
    id: t_outdoor
    name: Outdoor temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:sun-thermometer-outline
    update_interval: never
  - platform: template
    id: t_room
    name: Room temperature
    unit_of_measurement: "°C"
    device_class: temperature
