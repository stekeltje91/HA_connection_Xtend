# Add these to the secrets of ESPHome Device Builder (top right: "Secrets").
# Do not commit your real secrets.yaml.

# Name and password of the Xtend Wi-Fi access point (see the Xtend documentation / sticker)
xtend_wifi_ssid: "Xtend_xxxxxxxxxx"
xtend_wifi_password: "xtend-wifi-password"

# 32-byte base64 key for the encrypted Home Assistant API (also used for OTA updates).
# ESPHome Device Builder generates one for every new device, or create one at
# https://esphome.io/components/api/
xtend_api_key: "generate-a-new-key"
